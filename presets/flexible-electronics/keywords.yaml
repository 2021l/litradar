# 综述识别：只用于标记，最终由 Agent 核验标题/摘要/论文类型。
review_patterns:
  - "\\breview\\b"
  - "\\bperspective\\b"
  - "\\boverview\\b"
  - "\\broadmap\\b"
  - "\\btutorial\\b"
  - "recent (advances|progress|developments)"
  - "advances in"
  - "progress in"
  - "state of the art"
  - "a survey"
  - "systematic review"
  - "meta-analysis"

# 仅用于同分排序，不进入 100 分评分。
priority_tiebreak:
  - terms: [PEDOT, PEDOT:PSS, conductive polymer, conducting polymer]
    points: 3
  - terms: [aerospace, spacecraft, satellite, space environment, extreme environment]
    points: 3
  - terms: [impact sensor, impact monitoring, vibration monitoring, structural health monitoring, damage detection]
    points: 2
  - terms: [peel-off, transfer printing, delamination, freestanding film]
    points: 2
  - terms: [strain sensor, pressure sensor, tactile sensor, electronic skin]
    points: 2

