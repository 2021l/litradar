# 柔性电子文献雷达关键词库
# 说明：
# 1) gate 用于“是否进入候选池”，不直接决定分数。
# 2) direction 的 cap 之和 = 相关性满分 30 分。
# 3) 关键词采用不区分大小写的词边界匹配；连字符与空格视为等价。
# 4) 允许长期维护，但每次修改后应运行 scripts/health_check.py。

version: 1

gates:
  # 必须至少命中一个“柔性/可穿戴”核心词
  core:
    - flexible
    - stretchable
    - wearable
    - bendable
    - foldable
    - conformal
    - epidermal
    - electronic skin
    - e-skin
