# 柔性电子文献雷达关键词库
# 说明：
# 1) gate 用于“是否进入候选池”，不直接决定分数。
# 2) direction 的 cap 之和 = 相关性满分 30 分。
# 3) 关键词采用不区分大小写的词边界匹配；连字符与空格视为等价。
# 4) 允许长期维护，但每次修改后应运行 scripts/health_check.py。

version: 1

gates:
  # 必须至少命中一个“柔性/可穿戴”核心词
  core:
    - flexible
    - stretchable
    - wearable
    - bendable
    - foldable
    - conformal
    - epidermal
    - electronic skin
    - e-skin
    - skin-interfaced
    - skin-mounted
    - soft electronics
    - printed electronics
    - flexible electronics
    - stretchable electronics
    - wearable electronics

  # 除核心词外，还必须至少命中一个“器件/材料/应用”范围词，
  # 防止把“flexible metal-organic framework”等非电子学论文误收。
  scope:
    - electronics
    - electronic
    - sensor
    - sensing
    - electrode
    - transistor
    - conductor
    - conductive
    - circuit
    - display
    - antenna
    - actuator
    - diode
    - photodetector
    - transistor
    - energy harvester
    - nanogenerator
    - piezoelectric
    - triboelectric
    - thermoelectric
    - supercapacitor
    - battery
    - memory device
    - thin film
    - coating
    - printing
    - printed
    - substrate
    - hydrogel
    - elastomer
    - composite
    - pedot
    - mxene
    - graphene
    - nanowire
    - carbon nanotube
    - liquid metal
    - strain
    - pressure
    - tactile
    - temperature
    - humidity
    - gas
    - biosignal
    - electrophysiological
    - health monitoring
    - structural health monitoring
    - damage detection
    - impact
    - vibration
    - electroluminescent
    - interconnector
    - encapsulation

  # 明显的非研究内容或撤稿/勘误，直接排除出主榜
  exclude:
    - correction
    - erratum
    - retraction
    - retracted
    - editorial
    - obituary
    - book review
    - conference calendar
    - call for papers
    - table of contents
    - front cover
    - inside front cover
    - back cover
    - issue information
    - cover picture
    - masthead

